<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luriguayos · Taller de color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=4">
<link rel="stylesheet" href="escena.css?v=4">
</head>
<body>
<header class="cabecera">
  <div class="marca">
    <span class="tocapu" aria-hidden="true"></span>
    <div>
      <h1>Luriguayos</h1>
      <p>Danza y vestimenta tradicional · taller de color</p>
    </div>
  </div>
  <div class="controles">
    <div class="grupo">
      <button id="btn-azar" class="btn primario">🎲 Combinación aleatoria</button>
      <select id="esquema" title="Armonía de la combinación aleatoria">
        <option value="analoga">Análoga</option>
        <option value="complementaria">Complementaria</option>
        <option value="triadica" selected>Triádica</option>
        <option value="tetradica">Tetrádica</option>
        <option value="libre">Libre</option>
      </select>
    </div>
    <div class="grupo paletas" id="paletas"></div>
    <div class="grupo opciones">
      <label><input type="checkbox" id="opt-blancos" checked> Conservar blancos</label>
      <label><input type="checkbox" id="opt-conjunto" checked> Conjunto coordinado</label>
      <label class="tono-silueta" title="Tono de la silueta de los cuerpos"><input type="color" id="opt-silueta"> Silueta</label>
      <label><input type="checkbox" id="opt-ilustrado"> Cuerpo ilustrado</label>
      <button id="btn-vestir" class="btn">👕 Desvestir</button>
      <button id="btn-replay" class="btn">▶ Repetir entrada</button>
      <button id="btn-original" class="btn" title="Mantén presionado para ver la ilustración original">👁 Ver original</button>
      <button id="btn-seed" class="btn sutil" title="Copiar enlace de esta combinación">🔗 <b id="seed"></b></button>
    </div>
  </div>
</header>

<div class="disposicion">
  <main class="escenario-modelo">
    <svg id="escena" viewBox="0 0 1448 1086" aria-label="Pareja de danzantes luriguayos">
      <defs>
        <radialGradient id="foco" cx="50%" cy="55%" r="60%">
          <stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/>
          <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="grad-brillo" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="aura" x="-10%" y="-10%" width="120%" height="120%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="borde"/>
          <feFlood flood-color="#f2b705"/>
          <feComposite in2="borde" operator="in" result="aura"/>
          <feGaussianBlur in="aura" stdDeviation="4" result="suave"/>
          <feMerge><feMergeNode in="suave"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <ellipse class="piso" cx="760" cy="1062" rx="600" ry="30"/>
      <circle class="halo" cx="724" cy="540" r="600" fill="url(#foco)"/>
      <g id="mundo">
        <g id="fantasmas"></g>
        <g id="cuerpo"></g>
        <g id="base" style="display:none"></g>
        <g id="prendas"></g>
        <g id="brillos"></g>
      </g>
      <image id="ref" href="data/referencia.png" x="0" y="0" width="1448" height="1086" opacity="0" pointer-events="none"/>
    </svg>
    <div id="etiqueta" class="etiqueta"></div>
  </main>

  <aside class="panel" id="panel">
    <div class="panel-vacio" id="panel-vacio">
      <b>Toca una prenda</b>
      <p>para cambiar sus colores por zona. Vuelve a tocarla para editar un tono exacto.</p>
      <ul class="lista-prendas" id="lista-prendas"></ul>
    </div>
    <div class="panel-prenda" id="panel-prenda" hidden>
      <div class="pieza-cab">
        <div><h2 id="pp-nombre"></h2><small id="pp-info"></small></div>
        <div class="acciones">
          <button class="btn" id="pp-azar" title="Color aleatorio para esta prenda">🎲</button>
          <button class="btn" id="pp-orig" title="Colores originales">↺</button>
          <button class="btn" id="pp-cerrar" title="Cerrar">×</button>
        </div>
      </div>
      <div class="roles" id="pp-roles"></div>
    </div>
  </aside>
</div>

<div id="pop" class="pop" hidden>
  <div class="pop-cab">
    <span class="pop-muestra" id="pop-muestra"></span>
    <div><b id="pop-titulo">Tono</b><small id="pop-sub"></small></div>
    <button class="pop-x" id="pop-cerrar" aria-label="Cerrar">×</button>
  </div>
  <input type="color" id="pop-color">
  <div class="pop-acciones">
    <button class="btn" id="pop-reset">↺ Restablecer tono</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="data/escena.js?v=7"></script>
<script src="motor.js?v=4"></script>
<script src="silueta.js?v=1"></script>
<script src="escena.js?v=7"></script>
</body>
</html>
